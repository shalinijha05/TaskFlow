<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <header>
            <div class="logo">✓</div>
            <h1>TaskFlow</h1>
            <p>Organize your day, one task at a time.</p>
        </header>

        <section class="task-card">
            <h2>My Tasks</h2>
            <div class="task-input">
                <input type="text" id="taskInput" placeholder="What needs to be done?" maxlength="200">
                <button id="addBtn">+ Add</button>
            </div>
            <p id="errorMessage" class="error" role="status"></p>

            <div class="stats">
                <span id="totalCount">0 tasks</span>
                <span id="remainingCount">0 remaining</span>
            </div>

            <div class="filters" aria-label="Filter tasks">
                <button class="filter active" data-filter="all">All</button>
                <button class="filter" data-filter="active">Active</button>
                <button class="filter" data-filter="completed">Completed</button>
            </div>

            <ul id="taskList"></ul>

            <div id="emptyMessage" class="empty">
                <div class="empty-icon">✦</div>
                <h3>No tasks yet</h3>
                <p>Add a task above to get started!</p>
            </div>

            <button id="clearCompleted" class="clear-btn">Clear completed tasks</button>
        </section>
        <footer>Made with care · Stay focused, stay productive.</footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
